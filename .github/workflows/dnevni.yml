name: Dnevni ciklus
 
# Pokrece se svaki dan u 05:00 po podgorickom vremenu (03:00 UTC ljeti).
# Moze se pokrenuti i rucno, dugmetom "Run workflow".
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  racunaj:
    runs-on: ubuntu-latest
    timeout-minutes: 45
 
    steps:
      - uses: actions/checkout@v6
 
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
 
      # Fajlovi mogu biti u korijenu ili u podfolderu, zavisno kako su
      # prevuceni. Ovaj korak sam pronalazi gdje su i javlja to ostalima.
      # Fajlovi mogu zavrsiti u korijenu ili u podfolderu, zavisno kako su
      # prevuceni. Trazimo build.py i iz njega izvodimo sve putanje.
      - name: Nadji kod
        id: korijen
        run: |
          echo "--- sadrzaj repozitorijuma ---"
          find . -name "*.py" -not -path "./.git/*" | sort
          echo "------------------------------"
 
          F=$(find . -name build.py -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then
            echo "GRESKA: nigdje ne nalazim build.py."
            echo "Provjeri da je folder panula sa svih devet fajlova ucitan."
            exit 1
          fi
 
          PKG=$(dirname "$F")     # folder sa kodom, npr. ./panula
          D=$(dirname "$PKG")     # nivo iznad, odatle se pokrece
 
          # Prazan __init__.py se pri prevlacenju cesto izgubi; pravimo ga.
          if [ ! -f "$PKG/__init__.py" ]; then
            echo "Nedostaje __init__.py — pravim ga."
            touch "$PKG/__init__.py"
          fi
 
          if [ ! -f "$D/requirements.txt" ]; then
            R=$(find . -name requirements.txt -not -path "./.git/*" | head -1)
            [ -n "$R" ] && cp "$R" "$D/requirements.txt"
          fi
 
          PKGNAME=$(basename "$PKG")
 
          echo "dir=$D" >> $GITHUB_OUTPUT
          echo "pkg=$PKGNAME" >> $GITHUB_OUTPUT
          echo "Kod je u: $PKG"
          echo "Ime paketa: $PKGNAME"
          echo "Pokrecem iz: $D"
 
      - name: Instaliraj biblioteke
        working-directory: ${{ steps.korijen.outputs.dir }}
        run: pip install -r requirements.txt
 
      # Batimetrija se preuzima jednom pa se cuva izmedju pokretanja.
      - name: Kes batimetrije
        uses: actions/cache@v5
        with:
          path: |
            data/emodnet_bathymetry.tif
            ${{ steps.korijen.outputs.dir }}/data/emodnet_bathymetry.tif
          key: emodnet-bathymetry-v1
 
      - name: Izracunaj zone
        working-directory: ${{ steps.korijen.outputs.dir }}
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: |
          echo "Radni folder: $(pwd)"
          ls -la
          PYTHONPATH=. python -m ${{ steps.korijen.outputs.pkg }}.build
 
      - name: Provjeri da izlaz postoji
        working-directory: ${{ steps.korijen.outputs.dir }}
        run: |
          test -f public/index.json || { echo "Nema izlaza"; exit 1; }
          echo "Fajlova: $(ls public | wc -l)"
 
      - name: Objavi
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.korijen.outputs.dir }}/public
          keep_files: true
          
