<head>
<meta charset="utf-8">

<title>Pendula — Luštica / Ada Bojana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ------------------------------------------------------------ tokeni */
:root{
  --abis:#03101A;        /* najdublje */
  --ink:#061924;         /* pozadina */
  --panel-1:#0A2433;
  --panel-2:#0D2E40;
  --panel-3:#12384C;
  --line:rgba(122,196,222,.15);
  --line-jaka:rgba(122,196,222,.30);
  --cyan:#57DDEC;
  --cyan-tih:rgba(87,221,236,.13);
  --amber:#F2B450;
  --magenta:#F0628F;
  --sand:#EAE1CB;
  --dim:#8CA5B5;
  --display:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:4px;
  --sjena:0 2px 6px rgba(0,0,0,.32),0 12px 32px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(120% 90% at 18% -10%, #0C2E40 0%, transparent 58%),
    var(--ink);
  color:var(--sand);font-family:var(--display);
  font-size:15px;line-height:1.5;letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:2px}
::selection{background:var(--cyan);color:var(--abis)}

aside::-webkit-scrollbar{width:9px}
aside::-webkit-scrollbar-track{background:transparent}
aside::-webkit-scrollbar-thumb{background:var(--line-jaka);border-radius:9px;
  border:3px solid transparent;background-clip:content-box}
aside::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box}

/* ------------------------------------------------------------ raspored */
.app{display:flex;flex-direction:column;height:100dvh}
.main{display:grid;grid-template-columns:1fr 388px;min-height:0;flex:1}
@media(max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(200px,38vh) 1fr}
  .main.karta{grid-template-rows:1fr 0}
  .main.karta aside{display:none}
}

/* ----------------------------------------------------------- zaglavlje */
header{
  position:relative;display:flex;align-items:center;gap:13px;flex-wrap:wrap;
  padding:11px 18px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel-1));
  border-bottom:1px solid var(--line);
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--cyan),rgba(87,221,236,.15) 42%,transparent 78%);
}
.znak{
  width:38px;height:38px;border-radius:9px;display:block;flex:none;
  box-shadow:0 2px 10px rgba(0,0,0,.45);
}
.brand{display:flex;flex-direction:column;gap:1px}
.brand h1{
  margin:0;font-size:22px;font-weight:700;letter-spacing:.30em;
  text-transform:uppercase;line-height:1;
  background:linear-gradient(100deg,var(--sand),var(--cyan) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand span{
  font-family:var(--mono);font-size:10.5px;color:var(--dim);
  letter-spacing:.13em;text-transform:uppercase;
}
.autor{
  display:flex;align-items:center;gap:11px;margin-right:auto;
  padding-left:18px;border-left:1px solid var(--line);
}
.logo{height:30px;width:auto;display:block;opacity:.94;
  transition:opacity .16s}
.autor:hover .logo{opacity:1}
.autor-tekst{display:flex;flex-direction:column;line-height:1.4}
.autor-tekst span{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  color:var(--dim);white-space:nowrap;text-transform:uppercase}
.autor-tekst .tiho{color:#5E7789}

.days{display:flex;gap:3px;background:rgba(0,0,0,.30);padding:3px;
  border-radius:var(--r);border:1px solid var(--line)}
.days button{
  font-family:var(--mono);font-size:11.5px;padding:7px 15px;color:var(--dim);
  letter-spacing:.11em;border-radius:2px;text-transform:uppercase;
  transition:color .16s,background .16s;
}
.days button:hover{color:var(--sand)}
.days button[aria-pressed=true]{
  background:var(--cyan);color:var(--abis);font-weight:600;
  box-shadow:0 0 16px rgba(87,221,236,.35);
}

.stari{
  padding:8px 18px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.07em;color:var(--amber);
  background:linear-gradient(90deg,rgba(242,180,80,.18),transparent 65%);
  border-bottom:1px solid var(--line);
}
.stari::before{content:"\26A0  "}

/* ---------------------------------------------------------- upozorenje */
.safety{
  display:flex;align-items:center;gap:11px;padding:8px 18px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;
  border-bottom:1px solid var(--line);
}
.safety .dot{width:7px;height:7px;border-radius:50%;flex:none}
.safety b{letter-spacing:.16em;font-weight:600}
.safety.zeleno{background:linear-gradient(90deg,rgba(70,200,150,.16),transparent 62%);color:#7FE0B4}
.safety.zeleno .dot{background:#7FE0B4;box-shadow:0 0 9px #7FE0B4}
.safety.zuto{background:linear-gradient(90deg,rgba(242,180,80,.16),transparent 62%);color:var(--amber)}
.safety.zuto .dot{background:var(--amber);box-shadow:0 0 9px var(--amber)}
.safety.crveno{background:linear-gradient(90deg,rgba(240,98,143,.20),transparent 62%);color:var(--magenta)}
.safety.crveno .dot{background:var(--magenta);box-shadow:0 0 10px var(--magenta)}

/* --------------------------------------------------------------- mapa */
#map-wrap{position:relative;min-height:0}
#map{width:100%;height:100%;background:var(--abis)}
.leaflet-container{background:var(--abis);font-family:var(--mono)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  background:var(--panel-2);color:var(--sand);border-radius:var(--r);
  border:1px solid var(--line-jaka);box-shadow:var(--sjena);
}
.leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.65}
.leaflet-control-attribution{background:rgba(3,16,26,.72)!important;
  color:var(--dim)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--dim)!important}
.leaflet-bar a{background:var(--panel-1);color:var(--sand);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel-3);color:var(--cyan)}
/* OSM je svijetla karta - obrce se u tamnu da se uklopi u interfejs. */
.tamna-karta{filter:invert(1) hue-rotate(185deg) brightness(.78) contrast(1.08)
  saturate(.55)}
/* Esri morska karta je vec plava; samo se prigusi i pojaca kontrast dubina. */
.morska-karta{filter:brightness(.52) saturate(1.15) contrast(1.12)}
.izo{font-family:var(--mono);font-size:9px;color:#4A9CBA;
  text-shadow:0 0 3px var(--abis),0 0 3px var(--abis);pointer-events:none}

.alat{
  position:absolute;right:12px;z-index:600;width:40px;height:40px;
  border-radius:var(--r);font-size:16px;color:var(--sand);
  background:rgba(13,46,64,.92);border:1px solid var(--line-jaka);
  box-shadow:var(--sjena);backdrop-filter:blur(6px);
  transition:color .16s,background .16s,transform .16s;
}
.alat:hover{color:var(--cyan);transform:translateY(-1px)}
#karta{bottom:108px}
#ruler{bottom:60px}
#ruler[aria-pressed=true]{background:var(--amber);color:var(--abis);
  border-color:var(--amber);box-shadow:0 0 18px rgba(242,180,80,.4)}
.puna{bottom:12px;display:block}

.mjera{
  position:absolute;left:12px;bottom:12px;z-index:600;max-width:min(430px,72%);
  background:rgba(13,46,64,.94);border:1px solid var(--line-jaka);
  border-radius:var(--r);padding:9px 12px;backdrop-filter:blur(6px);
  font-family:var(--mono);font-size:11.5px;line-height:1.6;
  display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sjena);
}
.mjera b{color:var(--amber);font-size:15px;letter-spacing:.02em}
.mjera button{color:var(--dim);font-size:19px;line-height:1;padding:0 2px}
.mjera button:hover{color:var(--sand)}
.koord{color:var(--cyan);cursor:pointer;letter-spacing:.02em;font-family:var(--mono)}
.koord:hover{text-decoration:underline}
.mjera-oznaka{font-family:var(--mono);font-size:10px;color:var(--amber);
  white-space:nowrap;pointer-events:none;
  text-shadow:0 0 4px var(--abis),0 0 4px var(--abis)}
.luka{color:var(--cyan);font-size:19px;line-height:24px;text-align:center;
  cursor:pointer;transition:color .16s;
  text-shadow:0 0 4px var(--abis),0 0 4px var(--abis),0 0 4px var(--abis)}
.luka:hover{color:var(--amber)}
.luka-ime{background:var(--panel-2);border:1px solid var(--line-jaka);
  color:var(--sand);font-family:var(--mono);font-size:10px;border-radius:2px}

/* ---------------------------------------------------------- bocna traka */
aside{
  background:linear-gradient(180deg,var(--panel-1),var(--ink) 65%);
  border-left:1px solid var(--line);overflow-y:auto;min-height:0;
}
@media(max-width:900px){aside{border-left:none;border-top:1px solid var(--line)}}
.sect{padding:16px 18px;border-bottom:1px solid var(--line)}
.sect h2{
  margin:0 0 13px;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--dim);font-weight:500;
  display:flex;align-items:center;gap:9px;
}
.sect h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* --------------------------------------------------------------- vrste */
.vrste{display:flex;flex-wrap:wrap;gap:7px}
.vrsta{
  display:flex;align-items:center;gap:8px;padding:7px 13px 7px 9px;
  border:1px solid var(--line);border-radius:999px;font-size:13.5px;
  background:rgba(0,0,0,.18);
  transition:border-color .16s,background .16s,transform .16s;
}
.vrsta:hover{border-color:var(--line-jaka);transform:translateY(-1px)}
.vrsta .swatch{width:8px;height:8px;border-radius:50%;flex:none;opacity:.3;
  transition:opacity .16s,box-shadow .16s}
.vrsta[aria-pressed=true]{
  border-color:var(--boja,var(--cyan));
  background:color-mix(in srgb,var(--boja,#57DDEC) 15%,transparent);
}
.vrsta[aria-pressed=true] .swatch{opacity:1;
  box-shadow:0 0 9px var(--boja,var(--cyan))}
.vrsta .n{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:3px}
.vrsta.prazna{opacity:.42}
.vrsta.prazna[aria-pressed=true]{opacity:.9}

/* ------------------------------------------------- vodeni stub (nosilac) */
.stub{display:flex;gap:16px;align-items:flex-start}
.stub svg{flex:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.4))}
.stub .legenda{font-size:12.5px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stub .row{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.stub .key{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  color:var(--dim);text-transform:uppercase;white-space:nowrap}
.stub .val{font-family:var(--mono);font-size:13px;min-width:0;letter-spacing:.01em}
.obj{margin:13px 0 0;font-size:13px;color:var(--dim);line-height:1.65}

/* --------------------------------------------------------------- zone */
.zona{
  position:relative;width:100%;text-align:left;padding:12px 14px;
  margin-bottom:8px;border-radius:var(--r);
  background:linear-gradient(180deg,var(--panel-2),var(--panel-1));
  border:1px solid var(--line);border-left:3px solid var(--amber);
  transition:background .16s,transform .16s,border-color .16s;
  animation:ulaz .26s ease both;
}
.zona:hover{background:var(--panel-3);transform:translateX(2px)}
@keyframes ulaz{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.zona .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.zona .naziv{font-size:13.5px;font-weight:500}
.zona .skor{font-family:var(--mono);font-size:19px;font-weight:600;
  letter-spacing:-.02em;line-height:1}
.zona .izgledi{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;
  text-transform:uppercase;margin-top:3px}
.traka{height:2px;background:rgba(0,0,0,.35);border-radius:2px;margin:8px 0 7px;
  overflow:hidden}
.traka i{display:block;height:100%;border-radius:2px}
.zona .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.zona .razlog{font-size:12.5px;color:var(--dim);margin-top:6px;font-style:italic}
.zona .upw{font-size:11.5px;color:var(--cyan);margin-top:5px;
  font-family:var(--mono);letter-spacing:.03em}
.zona .koord{display:inline-block;margin-top:7px;font-size:11px}

.prazno{font-size:13.5px;color:var(--dim);padding:2px 0 12px;line-height:1.6}
.izvori{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.9}
.izvori b{color:var(--sand);font-weight:500;letter-spacing:.06em}
.stanje{padding:34px 22px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7}
.stanje code{font-family:var(--mono);font-size:11px;color:var(--cyan);
  display:block;margin-top:12px;word-break:break-all}

/* ------------------------------------------------------------- telefon */
@media(max-width:900px){
  body{font-size:16px}
  header{padding:10px 13px;gap:11px}
  .brand h1{font-size:18px;letter-spacing:.24em}
  .brand span{display:none}
  .znak{width:32px;height:32px;border-radius:8px}
  .autor{padding-left:12px;gap:0}
  .autor-tekst{display:none}
  .logo{height:25px}
  .days{width:100%;order:3}
  .days button{flex:1;padding:12px 6px;font-size:12.5px}
  .sect{padding:15px 13px}
  .vrste{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .vrste::-webkit-scrollbar{display:none}
  .vrsta{flex:none;min-height:44px}
  .zona{padding:14px;min-height:54px}
  .safety{padding:11px 13px;font-size:12.5px}
  .alat{width:44px;height:44px;font-size:19px}
  #karta{bottom:116px}
  #ruler{bottom:64px}
  .mjera{max-width:calc(100% - 74px);font-size:12px}
  aside{padding-bottom:env(safe-area-inset-bottom)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* Stepeni i decimalni minuti - format koji traze ploteri i GPS uredjaji. */
function dm(lat, lon){
  const jedan = (v, pozitivno, negativno, sirina) => {
    const znak = v >= 0 ? pozitivno : negativno;
    const a = Math.abs(v), st = Math.floor(a), mi = (a - st) * 60;
    return `${String(st).padStart(sirina,"0")}\u00b0${mi.toFixed(3).padStart(6,"0")}' ${znak}`;
  };
  return `${jedan(lat,"N","S",2)}  ${jedan(lon,"E","W",3)}`;
}

/* Rastojanje u nauticnim miljama (haversine). */
function nm(a, b){
  const R = 3440.065, rad = Math.PI/180;
  const dLat = (b.lat-a.lat)*rad, dLon = (b.lng-a.lng)*rad;
  const h = Math.sin(dLat/2)**2 +
            Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* Kurs u stepenima, pravi sjever. */
function kurs(a, b){
  const rad = Math.PI/180;
  const dLon = (b.lng-a.lng)*rad;
  const y = Math.sin(dLon)*Math.cos(b.lat*rad);
  const x = Math.cos(a.lat*rad)*Math.sin(b.lat*rad) -
            Math.sin(a.lat*rad)*Math.cos(b.lat*rad)*Math.cos(dLon);
  return (Math.atan2(y,x)/rad + 360) % 360;
}

function kopiraj(tekst, el){
  navigator.clipboard.writeText(tekst).then(()=>{
    const staro = el.textContent;
    el.textContent = "kopirano";
    setTimeout(()=>{ el.textContent = staro; }, 900);
  }).catch(()=>{});
}

const MJESECI = ["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];

// Vrste koje se ne prikazuju. Backend ih i dalje racuna — da se vrate,

let mjerenje = false, tacke = [], imena = [];

/* ---------------------------------------------------------- mapa */
function napraviMapu(){
  map = L.map("map",{zoomControl:true, attributionControl:true})
         .setView([41.95,19.05], 10);

  // Dvije podloge, obje bez kljuca. CARTO je izbacen jer je poceo da trazi
  // API kljuc i preko mape ispisuje "API KEY Required".
  podloge = {
    tamna: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution:'&copy; OpenStreetMap &middot; podaci: Copernicus Marine, EMODnet',
      maxZoom:18, className:"tamna-karta"
    }),
    more: L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",
      {attribution:'Esri, GEBCO, NOAA &middot; podaci: Copernicus Marine, EMODnet',
       maxZoom:10, className:"morska-karta"}
    ),
  };
  podloga = "more";
  azurirajPodlogu();
  map.on("zoomend", azurirajPodlogu);

  izoSloj = L.layerGroup().addTo(map);   // uvijek ispod zona
  sloj = L.layerGroup().addTo(map);
  mjerSloj = L.layerGroup().addTo(map);
  crtajLuke();
  map.on("click", e => { if(mjerenje) dodajTacku(e.latlng); });
}

const MORE_DO_ZUMA = 10;   // dalje od ovoga Esri nema podatke za nase more
                           // (svjetska pokrivenost ide do razmjere 1:577k)

/* Bira koja se podloga zaista crta.

   Morska karta ima sjencenje dubina, ali svjetsku pokrivenost samo do
   jedanaestog nivoa uvecanja; preko toga vraca sivu plocu sa natpisom da
   podataka nema. Zato se pri vecem uvecanju sama smjenjuje tamnom kartom,
   koja ide do kraja. */
function azurirajPodlogu(){
  const duboko = map.getZoom() > MORE_DO_ZUMA;
  const treba = (podloga === "more" && !duboko) ? "more" : "tamna";

  for(const [ime, sl] of Object.entries(podloge)){
    if(ime === treba && !map.hasLayer(sl)) sl.addTo(map).bringToBack();
    if(ime !== treba && map.hasLayer(sl)) map.removeLayer(sl);
  }

  const b = document.getElementById("karta");
  if(!b) return;
  b.textContent = podloga === "more" ? "\u25F3" : "\u25E9";
  b.title = podloga === "more"
    ? (duboko ? "Morska karta - nema je na ovom uvecanju, prikazana je tamna"
              : "Morska karta - prebaci na tamnu")
    : "Tamna karta - prebaci na morsku";
  b.style.opacity = (podloga === "more" && duboko) ? ".55" : "1";
}

function prebaciPodlogu(){
  podloga = podloga === "more" ? "tamna" : "more";
  azurirajPodlogu();
}

/* Matične luke kao referentne tačke - klikom se dodaju u daljinar. */
function crtajLuke(){
  LUKE.forEach(l=>{
    L.marker([l.lat,l.lon], {icon:L.divIcon({className:"luka", html:"\u2693",
      iconSize:[24,24], iconAnchor:[12,12]})})
     .addTo(map)
     .bindTooltip(l.n, {direction:"top", className:"luka-ime"})
     .on("click", e=>{
        L.DomEvent.stop(e);
        if(!mjerenje) prebaciMjerenje(true);
        dodajTacku(L.latLng(l.lat, l.lon), l.n);
     });
  });
}

/* ---------------------------------------------------------- daljinar */
function prebaciMjerenje(ukljuci){
  mjerenje = ukljuci !== undefined ? ukljuci : !mjerenje;
  const b = document.getElementById("ruler");
  b.setAttribute("aria-pressed", mjerenje);
  document.getElementById("mjera").hidden = !mjerenje;
  map.getContainer().style.cursor = mjerenje ? "crosshair" : "";
  if(!mjerenje) ocistiMjerenje();
}

function ocistiMjerenje(){
  tacke = []; imena = []; mjerSloj.clearLayers();
  document.getElementById("mjera-tekst").innerHTML =
    "Klikni na mapu ili na sidro da dodaš tačku.";
}

function dodajTacku(ll, ime){
  tacke.push(ll); imena.push(ime || null);
  mjerSloj.clearLayers();

  L.polyline(tacke, {color:"#F0B03C", weight:2, dashArray:"6 4"}).addTo(mjerSloj);
  tacke.forEach((t,i)=>{
    L.circleMarker(t, {radius:4, color:"#F0B03C", fillColor:"#061620",
                       fillOpacity:1, weight:2}).addTo(mjerSloj);
    if(i>0){
      const d = nm(tacke[i-1], t), k = kurs(tacke[i-1], t);
      L.marker(L.latLng((tacke[i-1].lat+t.lat)/2, (tacke[i-1].lng+t.lng)/2),
        {interactive:false, icon:L.divIcon({className:"mjera-oznaka",
          html:`${d.toFixed(2)} nM &middot; ${k.toFixed(0)}\u00b0`,
          iconSize:[92,14]})}).addTo(mjerSloj);
    }
  });

  let ukupno = 0;
  for(let i=1;i<tacke.length;i++) ukupno += nm(tacke[i-1], tacke[i]);
  const zadnja = tacke[tacke.length-1];
  const nazivi = imena.filter(Boolean);

  document.getElementById("mjera-tekst").innerHTML = tacke.length < 2
    ? `<b>${imena[0] || "start"}</b><br><span class="koord">${dm(zadnja.lat, zadnja.lng)}</span>`
    : `<b>${ukupno.toFixed(2)} nM</b> &middot; ${(ukupno*1.852).toFixed(2)} km` +
      (tacke.length === 2 ? ` &middot; kurs ${kurs(tacke[0],tacke[1]).toFixed(0)}\u00b0` : "") +
      (nazivi.length ? `<br>od: ${nazivi.join(", ")}` : "") +
      `<br><span class="koord">${dm(zadnja.lat, zadnja.lng)}</span>`;
}

/* Izobate su privremeno iskljucene — linije su izlazile na kopno.
   Da se vrate, dovoljno je pozvati crtajIzobate() u start(). */
async function crtajIzobate(){
  let fc;
  try{ fc = await json(indeks.izobate || "izobate.geojson"); }
  catch(e){ return; }                      // nema ih — mapa radi i bez toga
  fc.features.forEach(f=>{
    const d = f.properties.dubina_m, glavna = f.properties.glavna;
    L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]), {
      color: d <= 100 ? "#3E93B0" : "#26647C",
      weight: glavna ? 1.2 : (d <= 100 ? .9 : .6),
      opacity: glavna ? .8 : (d <= 100 ? .6 : .35), interactive:false
    }).addTo(izoSloj);
    if(glavna || d <= 100){
      const t = f.geometry.coordinates[Math.floor(f.geometry.coordinates.length/2)];
      L.marker([t[1],t[0]],{interactive:false, icon:L.divIcon({
        className:"izo", html:d, iconSize:[26,12]})}).addTo(izoSloj);
    }
  });
}

/* ---------------------------------------------------- ucitavanje */
async function json(putanja){
  if(kes.has(putanja)) return kes.get(putanja);
  const r = await fetch(BAZA + putanja, {cache:"no-cache"});
  if(!r.ok) throw new Error(r.status + " " + putanja);
  const d = await r.json();
  kes.set(putanja, d);
  return d;
}

async function start(){
  napraviMapu();
  try{
    indeks = await json("index.json");
  }catch(e){
    document.querySelector("aside").innerHTML =
      `<div class="stanje">Ne mogu da učitam podatke.<br>Provjeri da je adresa dostupna:
       <code>${BAZA}index.json</code></div>`;
    return;
  }
  indeks.vrste = indeks.vrste.filter(v => !SAKRIJ.has(v));
  dan = indeks.dani[0];
  crtajDane();
  crtajIzvore();
  provjeriSvjezinu();
  await crtajVrste();
  await osvjezi();
}

function crtajDane(){
  const box = document.getElementById("dani");
  box.innerHTML = "";
  indeks.dani.forEach((d,i)=>{
    const dt = new Date(d+"T12:00:00");
    const b = document.createElement("button");
    b.textContent = i===0 ? "DANAS" : `${dt.getDate()}. ${MJESECI[dt.getMonth()]}`;
    b.setAttribute("aria-pressed", d===dan);
    b.onclick = async ()=>{ dan = d; crtajDane(); await crtajVrste(); await osvjezi(); };
    box.appendChild(b);
  });
}

/* Ako dnevni ciklus zakaze, na adresi ostaju jucerasnji fajlovi. Bolje je
   da aplikacija to kaze nego da tiho prikaze stare zone kao danasnje. */
function provjeriSvjezinu(){
  const danas = new Date(); danas.setHours(0,0,0,0);
  const prvi = new Date(indeks.dani[0] + "T00:00:00");
  const dana = Math.round((danas - prvi) / 86400000);
  const el = document.getElementById("stari");
  if(dana <= 0){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = dana === 1
    ? "Podaci su od juce - jutarnje osvjezavanje nije proslo."
    : `Podaci su stari ${dana} dana - osvjezavanje ne prolazi.`;
}

function crtajIzvore(){
  const iz = indeks.izvori || {};
  const red = (k,v)=> v ? `<div><b>${k}</b> ${v}</div>` : "";
  document.getElementById("izvori").innerHTML =
    red("SST", iz.sst ? `${iz.sst.datum} · ${iz.sst.rezolucija_km} km` : null) +
    red("Hlorofil", iz.hlorofil ? `${iz.hlorofil.datum} · ${iz.hlorofil.senzor}` : null) +
    red("Struje", iz.struje ? `${iz.struje.rezolucija_km} km` : null) +
    red("Meteo", iz.meteo ? (iz.meteo.dostupan ? "dostupan" : "nedostupan — upozorenja iz talasa") : null) +
    red("Granica panule", (indeks.granica_dubine_panule_m||50) + " m") +
    red("Osvježeno", (indeks.generisano||"").replace("T"," ").replace("Z"," UTC"));
}

/* --------------------------------------------------------- vrste */
async function crtajVrste(){
  const box = document.getElementById("vrste");
  box.innerHTML = "";
  const podaci = await Promise.all(indeks.vrste.map(v =>
    json(`${v}_${dan}.geojson`).catch(()=>null)));

  let najbolja = null, najskor = -1;
  indeks.vrste.forEach((v,i)=>{
    const fc = podaci[i], n = fc ? fc.features.length : 0;
    const b = document.createElement("button");
    b.className = "vrsta";
    b.style.color = BOJE[v];
    b.style.setProperty("--boja", BOJE[v]);
    b.innerHTML = `<span class="swatch" style="background:${BOJE[v]}"></span>` +
                  `<span style="color:var(--sand)">${fc ? fc.properties.naziv : v}</span>` +
                  (n ? `<span class="n">${n}</span>` : "");
    if(!n){ b.classList.add("prazna");
            b.title = (fc && fc.properties.razlog_praznog) || "Nema područja"; }
    b.setAttribute("aria-pressed", izabrane.has(v));
    b.onclick = ()=>{ izabrane.has(v) ? izabrane.delete(v) : izabrane.add(v);
                      crtajVrste().then(osvjezi); };
    box.appendChild(b);

    if(n){
      const s = fc.features[0].properties.score_mean;
      if(s > najskor){ najskor = s; najbolja = v; }
    }
  });

  // Prvi put biramo vrstu sa najboljim izgledima, da ekran ne bude prazan
  if(!izabrane.size && najbolja){ izabrane.add(najbolja); return crtajVrste(); }
}

/* ------------------------------------------------------ osvjezi */
async function osvjezi(){
  sloj.clearLayers();
  const lista = [...izabrane];
  const skupovi = (await Promise.all(lista.map(v =>
    json(`${v}_${dan}.geojson`).catch(()=>null)))).filter(Boolean);

  crtajSafety(skupovi[0]);   // upozorenje je isto za sve vrste
  crtajStub(skupovi.find(f=>f.features.length) || skupovi[0]);
  crtajZone(skupovi);

  const granice = [];
  skupovi.forEach(fc=>{
    const boja = BOJE[fc.properties.vrsta];
    fc.features.forEach((f,i)=>{
      const p = f.properties;
      const jak = p.score_mean / 100;
      const poly = L.polygon(
        f.geometry.coordinates[0].map(c=>[c[1],c[0]]),
        {color:boja, weight:1.5, opacity:.95,
         fillColor:boja, fillOpacity:.14 + .3*jak}
      ).bindPopup(
        `<b style="color:${boja}">${fc.properties.naziv}</b> · zona ${i+1}<br>` +
        `izgledi <b>${p.izgledi||"—"}</b> · ${p.score_mean.toFixed(0)}/100 · ${p.area_km2} km²<br>` +
        (p.sst_raspon_C!=null ? `promjena SST ${p.sst_raspon_C.toFixed(1)} °C / 3 km<br>` : "") +
        (p.upwelling>=.35 ? `<span style="color:#4FD8E8">↑ izdizanje dubinske vode</span><br>` : "") +
        (p.dubina_panule_m!=null ? `panula na <b>${p.dubina_panule_m} m</b><br>` : "") +
        `<span style="color:var(--sand-dim)">${p.razlog||""}</span><br>` +
        `<span class="koord">${dm(p.centroid[1], p.centroid[0])}</span>`
      );
      poly.addTo(sloj);
      granice.push(...poly.getLatLngs()[0]);
    });
  });
  if(granice.length) map.fitBounds(L.latLngBounds(granice).pad(.25),
                                  {maxZoom: MORE_DO_ZUMA});
}

/* --------------------------------------------------- upozorenje */
function crtajSafety(fc){
  const el = document.getElementById("safety");
  if(!fc){ el.hidden = true; return; }
  const b = fc.properties.bezbjednost || {};
  el.hidden = false;
  el.className = "safety " + (b.nivo || "zeleno");
  document.getElementById("safety-nivo").textContent =
    b.izlazak_preporucen === false ? "NE PREPORUČUJE SE IZLAZAK" : (b.nivo||"").toUpperCase();
  document.getElementById("safety-razlog").textContent = b.razlog || "";
}

/* ------------------------------------------ vodeni stub (SVG) */
function crtajStub(fc){
  const sect = document.getElementById("sect-stub");
  if(!fc){ sect.hidden = true; return; }
  sect.hidden = false;

  const v = fc.properties.vertikala || {};
  const prof = fc.properties.profil;
  document.querySelector("#sect-stub h2").textContent =
    prof ? `Vodeni stub — ${fc.properties.naziv.toLowerCase()}, ${prof}`
         : "Vodeni stub";
  const pan = fc.properties.panula || {};
  const GR = indeks.granica_dubine_panule_m || 50;
  const sloj_p = v.sloj_plijena_m || [];
  const maxD = Math.max(GR + 12, (sloj_p[1] || 0) + 10, (v.dcm_m || 0) + 10);
  const H = 230, W = 104, y = d => 16 + (d / maxD) * (H - 30);

  const dio = [];
  // voda
  dio.push(`<defs>
    <linearGradient id="voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A6B87"/><stop offset=".55" stop-color="#0E3A4E"/><stop offset="1" stop-color="#04141D"/>
    </linearGradient>
    <pattern id="van" width="6" height="6" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#EE5A8E" stroke-width="1.1" opacity=".4"/>
    </pattern>
  </defs>`);
  dio.push(`<rect x="16" y="${y(0)}" width="46" height="${y(maxD)-y(0)}"
            fill="url(#voda)" rx="3"/>`);

  // izvan dohvata panule
  dio.push(`<rect x="16" y="${y(GR)}" width="46" height="${y(maxD)-y(GR)}" fill="url(#van)"/>`);
  dio.push(`<line x1="10" y1="${y(GR)}" x2="68" y2="${y(GR)}" stroke="#EE5A8E"
            stroke-width="1.4" stroke-dasharray="4 3"/>`);
  dio.push(`<text x="72" y="${y(GR)+3.5}" fill="#EE5A8E" font-size="9"
            font-family="var(--mono)">${GR} m</text>`);

  // sloj plijena
  if(sloj_p.length === 2){
    dio.push(`<rect x="16" y="${y(sloj_p[0])}" width="46"
              height="${Math.max(2, y(sloj_p[1])-y(sloj_p[0]))}"
              fill="#8FD94F" opacity=".22"/>`);
  }
  // termoklina
  if(v.termoklina_m != null){
    dio.push(`<line x1="16" y1="${y(v.termoklina_m)}" x2="62" y2="${y(v.termoklina_m)}"
              stroke="#57DDEC" stroke-width="2.2" stroke-linecap="round"
              opacity=".95"/>`);
    dio.push(`<line x1="16" y1="${y(v.termoklina_m)}" x2="62" y2="${y(v.termoklina_m)}"
              stroke="#57DDEC" stroke-width="6" stroke-linecap="round"
              opacity=".18"/>`);
  }
  // DCM
  if(v.dcm_m != null){
    dio.push(`<circle cx="39" cy="${y(v.dcm_m)}" r="4" fill="none"
              stroke="#8FD94F" stroke-width="1.6"/>`);
  }
  // preporucena dubina panule
  const pd = fc.features[0] && fc.features[0].properties.dubina_panule_m;
  if(pd != null){
    dio.push(`<polygon points="8,${y(pd)-4.5} 15,${y(pd)} 8,${y(pd)+4.5}"
              fill="${BOJE[fc.properties.vrsta]}"/>`);
    dio.push(`<line x1="15" y1="${y(pd)}" x2="62" y2="${y(pd)}"
              stroke="${BOJE[fc.properties.vrsta]}" stroke-width="1.2" opacity=".8"/>`);
  }
  // skala
  [0, Math.round(maxD/2), Math.round(maxD)].forEach(d=>{
    dio.push(`<line x1="62" y1="${y(d)}" x2="66" y2="${y(d)}"
              stroke="#8CA5B5" stroke-width="1" opacity=".5"/>`);
    dio.push(`<text x="60" y="${y(d)+3}" fill="#8CA5B5" font-size="8.5"
              font-family="IBM Plex Mono, monospace" text-anchor="end"
              opacity=".75">${d}</text>`);
  });
  document.getElementById("stub").innerHTML = dio.join("");
  document.getElementById("stub").setAttribute("viewBox", `0 0 ${W} ${H}`);

  const red = (k, val, boja) => val == null ? "" :
    `<div class="row"><span class="key" ${boja?`style="color:${boja}"`:""}>${k}</span>
     <span class="val">${val}</span></div>`;
  document.getElementById("stub-legenda").innerHTML =
    red("Termoklina", v.termoklina_m != null ? v.termoklina_m + " m" : "nema", "#4FD8E8") +
    red("DCM", v.dcm_m != null
        ? v.dcm_m + " m" + (v.dcm_debljina_m ? ` ±${(v.dcm_debljina_m/2).toFixed(0)}` : "")
        : "—", "#8FD94F") +
    red("Plijen", sloj_p.length===2 ? `${sloj_p[0]}–${sloj_p[1]} m` : null, "#8FD94F") +
    red("Panula", pan.dubina_m ? `${pan.dubina_m[0]}–${pan.dubina_m[1]} m` : null,
        BOJE[fc.properties.vrsta]) +
    red("Brzina", pan.brzina_kn ? `${pan.brzina_kn[0]}–${pan.brzina_kn[1]} čv` : null) +
    red("Sati", pan.sati || null) +
    red("Dohvat", v.dohvatljivost != null ? Math.round(v.dohvatljivost*100) + "%" : null,
        v.dohvatljivost < .35 ? "#EE5A8E" : null);
  document.getElementById("stub-obj").innerHTML =
    (v.objasnjenje || "") +
    (fc.properties.napomena
      ? `<br><span style="color:${BOJE[fc.properties.vrsta]}">${fc.properties.napomena}</span>`
      : "");
}

/* ---------------------------------------------------------- zone */
function crtajZone(skupovi){
  const sect = document.getElementById("sect-zone");
  const box = document.getElementById("zone");
  if(!skupovi.length){ sect.hidden = true; return; }
  sect.hidden = false;

  const sve = [];
  skupovi.forEach(fc => fc.features.forEach((f,i) =>
    sve.push({fc, f, i, s:f.properties.score_mean})));
  sve.sort((a,b)=> b.s - a.s);

  if(!sve.length){
    box.innerHTML = skupovi.map(fc =>
      `<p class="prazno"><b style="color:${BOJE[fc.properties.vrsta]}">
       ${fc.properties.naziv}</b><br>${fc.properties.razlog_praznog
       || "Nema područja koje prelazi prag."}</p>`).join("");
    return;
  }

  box.innerHTML = "";
  sve.forEach(({fc,f,i})=>{
    const p = f.properties, boja = BOJE[fc.properties.vrsta];
    const b = document.createElement("button");
    b.className = "zona";
    b.style.borderLeftColor = boja;
    b.innerHTML =
      `<div class="top"><span class="naziv">${fc.properties.naziv} · zona ${i+1}</span>
       <span class="skor" style="color:${boja}">${p.score_mean.toFixed(0)}</span></div>
       <div class="izgledi" style="color:${boja}">${p.izgledi||""}</div>
       <div class="traka"><i style="width:${Math.max(3,Math.min(100,p.score_mean))}%;
         background:${boja}"></i></div>
       <div class="meta">${p.area_km2} km²` +
       (p.dubina_panule_m != null ? ` · panula ${p.dubina_panule_m} m` : "") +
       (p.sst_raspon_C != null ? ` · ΔT ${p.sst_raspon_C.toFixed(1)}°C/3km` : "") + `</div>` +
      (p.upwelling >= .35
        ? `<div class="upw">↑ izdizanje dubinske vode${p.hladnije_C
            ? ` · ${p.hladnije_C.toFixed(1)}°C hladnije od okoline` : ""}</div>` : "") +
      (p.razlog ? `<div class="razlog">${p.razlog}</div>` : "") +
      `<div class="koord" data-koord="${dm(p.centroid[1], p.centroid[0])}"
        title="Klikni da kopiraš">${dm(p.centroid[1], p.centroid[0])}</div>`;
    b.onclick = (ev)=>{
      const k = ev.target.closest(".koord");
      if(k){ kopiraj(k.dataset.koord, k); return; }
      const ll = f.geometry.coordinates[0].map(c=>[c[1],c[0]]);
      map.fitBounds(L.latLngBounds(ll).pad(.6), {maxZoom: 13});
    };
    box.appendChild(b);
  });
}

document.getElementById("karta").onclick = ()=> prebaciPodlogu();
document.getElementById("ruler").onclick = ()=> prebaciMjerenje();
document.getElementById("mjera-brisi").onclick = ()=> ocistiMjerenje();
